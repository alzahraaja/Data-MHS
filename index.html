<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset=""UTF-8">
        <title>Form Inline CSS</title>
    </head>
    <Body style="background-color:#E6E6FA; font-family: arial, sans-serif; padding: 20px;">
    </Body>

    <div style="max-width:500px; margin:30px auto;background-color:#ffffff; padding:25px; border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0,1)">
    <h3 style="margin-top:0; color: #1a252f; padding-bottom: 10px;">Tambah Data Mahasiswa</h3>
  <Form>
    <div style="margin-bottom:15px;">
        <label style="display:block;margin-bottom:5px;font-weight:bold;color:#333;">NIM:</label>
        <input type="text"placeholder="Masukkan NIM"style="width:100%;padding:10px;border:1px solid #dddddd;border-radius:4px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:15px;">
        <label style="display:block;margin-bottom:5px;font-weight:bold;color:#333;">Nama:</label>
        <input type="text"placeholder="Masukkan Nama"style="width:100%;padding:10px;border:1px solid #dddddd;border-radius:4px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:15px;">
        <label style="display:block;margin-bottom:5px;font-weight:bold;color:#333;">Mata Kuliah:</label>
        <select style="width:100%; padding:10px; border: 1px solid #dbd7d7; border-radius: 4px; box-sizing: border-box;">
            <option>Pemrograman Web</option>
            <option>Basis Data</option>
            <option>Desain UI/UX</option>
        </select>
    </div>
    <Button type="submit"style="width:100%;background-color: #663399; color:white; padding:12px; border:none;border-radius:4px; font-size:16px; cursor: pointer;">Simpan Data</Button>
  </Form>
</div>
</html>
